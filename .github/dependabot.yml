version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:17"
      timezone: "Europe/Berlin"
  
  - package-ecosystem: "nuget"
    directory: "/"
    exclude-paths:
      - "tests/**"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:17"
      timezone: "Europe/Berlin"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:17"
      timezone: "Europe/Berlin"
    ignore:
      - dependency-name: "dotnet/sdk" # Only .NET minor/patch and digest updates
        update-types:
          - "version-update:semver-major"
    groups:
      docker-images:
        patterns:
          - "*"
